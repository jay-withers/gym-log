[project]
name = "gymlog"
version = "0.1.0"
description = "Twice-weekly full-body training log, with progression suggestions"
requires-python = ">=3.12"

# One package, one image, three entrypoints (serve, import, show). They share the
# model, the store and the progression rule, so splitting them would mean three
# builds of near-identical layers.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "jinja2>=3.1",
  # FastAPI's Form() parsing needs it, and the failure without it is a 500 at
  # the first login rather than anything at import time.
  "python-multipart>=0.0.20",
  "azure-identity>=1.19",
  "azure-keyvault-secrets>=4.9",
  "azure-storage-blob>=12.24",
  "azure-monitor-opentelemetry>=1.6",
  # Garmin has no public API for personal accounts. This wraps garth's OAuth
  # session handling against Garmin Connect's own web endpoints — the first
  # non-stdlib HTTP dependency here, everything else uses urllib directly.
  "garminconnect>=0.2.12",
]

[project.optional-dependencies]
# httpx2, not httpx: starlette's TestClient deprecated the latter, and with
# `filterwarnings = ["error"]` below that deprecation fails collection outright.
dev = ["pytest>=8.3", "ruff>=0.8", "httpx2>=0.28"]

# What the Dockerfile's ENTRYPOINT resolves to. Terraform sets no `command`, so
# this name lives in exactly one place.
[project.scripts]
gymlog = "gymlog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gymlog"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S: bandit's security rules, so a risky pattern fails the commit locally
# rather than waiting for CodeQL on the pull request.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body", "fastapi.Cookie", "fastapi.Depends", "fastapi.Form",
  "fastapi.Header", "fastapi.Path", "fastapi.Query",
]

# Test code is exempt from the bandit rules that only make sense in shipped
# code: pytest is built on `assert` (S101), fixtures use dummy tokens (S105,
# S106) and loopback binds (S104), and a test may shell out on purpose (S603,
# S607). Everything else under "S" still applies to tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Warnings are errors, so a deprecation in a dependency is seen on the bump
  # that introduced it rather than on the release that removes the feature.
  "error",
  # Raised inside starlette's own TestClient import, not by anything here.
  # market-agent carries the identical ignore for the identical reason.
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]
