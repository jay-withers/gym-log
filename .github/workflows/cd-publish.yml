name: cd-publish

# Publishes the image to GHCR for a given tag, then deploys it to dev. Invoked by cd-tag after a version
# bump, or manually to (re)publish an existing tag.
#
# It exists as a workflow of its own rather than folding into cd-tag because the
# workflow_dispatch trigger is the documented way to re-publish an existing tag
# after a failed build, without minting a new version.
#
# Two tags are pushed, both immutable:
#
#   vX.Y.Z    the release this came from, for a deploy someone has to reason
#             about later
#   <sha>     the short commit SHA, which is what the Makefile's IMAGE_TAG
#             defaults to
#
# Neither is ever moved. Container Apps only creates a revision when the
# template changes, so re-pushing a moving tag would deploy nothing and report
# success — the failure mode this avoids by construction.
#
# **A green publish is not evidence the tags are right.** A release through this
# shared workflow once pushed the SHA tag and silently lost the version tag.
# Check the registry after a release:
#
#   gh api user/packages/container/gym-log%2Fgymlog/versions?per_page=3 \
#     --jq '.[] | "\(.updated_at) \(.metadata.container.tags|join(", "))"'
on:
  workflow_call:
    inputs:
      version:
        description: Git tag to publish (e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing git tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # `ref` is the tag rather than the default checkout, and that is what makes
  # tag-with-sha correct: on a workflow_call github.sha is the calling branch's
  # head, not the tag, so resolving the short SHA from anything else would
  # record a commit that was never built.
  #
  # packages: write has to be granted here — docker.yml declares no permissions
  # of its own precisely so a caller can hand it more than read.
  publish:
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy findings to code scanning
    uses: jay-withers/workflows/.github/workflows/docker.yml@c3cb744bf5ded408403142ab2ad28b5cdefe08c1 # v1.12.0
    with:
      images: |
        [{"name": "gymlog", "context": "."}]
      ref: ${{ inputs.version }}
      push: true
      tags: ${{ inputs.version }}
      tag-with-sha: true
      summary-note: The `deploy` job rolls this onto dev. To redeploy, re-run this workflow with the tag.

  # Rolls the tag just published onto dev with this repo's own `make deploy`,
  # through the shared container-apps-deploy.yml: OIDC in the `dev` GitHub
  # environment, then `make deploy IMAGE_TAG=<version>` from a checkout of the
  # tag. It runs on a manual re-publish too, so workflow_dispatch is also how
  # to redeploy an existing tag.
  #
  # id-token: write must also be granted by cd-tag's publish job, which calls
  # this workflow: a called workflow never holds more than its caller.
  deploy:
    needs: publish
    permissions:
      id-token: write
      contents: read
      issues: write # the deploy-failed issue
    uses: jay-withers/workflows/.github/workflows/container-apps-deploy.yml@c3cb744bf5ded408403142ab2ad28b5cdefe08c1 # v1.12.0
    with:
      version: ${{ inputs.version }}
