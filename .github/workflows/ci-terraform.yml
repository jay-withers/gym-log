name: ci-terraform

# Terraform CI. The shared workflow runs credential-free init and validate.
# Plans are intentionally left to an operator with access to the applied shared
# Container Apps environment; this repository resolves that environment through
# a data source and cannot produce a useful credential-free plan.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Credential-free init and validate. pull-requests: read is what the shared
  # workflow's own path filter needs; it runs inside that workflow, so the
  # permission has to be granted from here.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@a5015ee2aed310376c5a0a1b19ced327dfd4fbd4 # v1.4.5
