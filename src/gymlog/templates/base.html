<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover plus the safe-area padding below: without it the bottom
     bar sits under the home indicator on a notched phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<title>{% block title %}Health{% endblock %}</title>
<style>
  /* Dark by default rather than by preference: this is read under gym lighting,
     one-handed, and a white screen at 6am is its own argument. */
  :root {
    --bg: #101014; --card: #1a1a20; --line: #2c2c35;
    --text: #f2f2f5; --dim: #9a9aa8; --accent: #7dd3a0; --warn: #e8b84b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 640px; margin-inline: auto;
  }
  a { color: var(--accent); }
  header { padding: 20px 0 12px; display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
  }
  .slot { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .name { font-size: 17px; font-weight: 600; margin: 2px 0 6px; }
  .reason { color: var(--accent); font-size: 14px; margin-bottom: 10px; }
  .reason.stalled { color: var(--warn); }
  .last { color: var(--dim); font-size: 13px; margin-bottom: 10px; }
  /* A saved exercise recedes rather than disappears: it is still editable, but
     the eye should land on the next one that is not done. */
  .card.recorded { border-color: var(--accent); opacity: .72; }
  .card.recorded:focus-within { opacity: 1; }
  .target { color: var(--text); font-size: 13px; margin-bottom: 8px; }
  /* The one thing the stripped-back card still has to be able to shout: the
     last session fell short of the range, so the weight is deliberately not
     going up this time. */
  .target.stalled { color: var(--warn); }
  .target b { font-weight: 600; }
  .target .per-set { color: var(--dim); }
  /* Name above, range beneath: the two rep boxes are narrow enough to sit
     side by side one-handed without either falling under the 16px floor. */
  .range { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px;
           align-items: center; margin-top: 6px; }
  .range span { color: var(--dim); font-size: 13px; }
  .sets { display: grid; gap: 8px; }
  .set { display: grid; grid-template-columns: 28px 1fr 1fr; gap: 8px; align-items: center; }
  .set span { color: var(--dim); font-size: 13px; }
  /* 16px minimum on inputs: anything smaller makes iOS Safari zoom the page on
     focus, and it never zooms back out. */
  input[type=number], input[type=text], input[type=password], input[type=date] {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid var(--line); background: #0b0b0e; color: var(--text);
  }
  button, .btn {
    display: block; width: 100%; padding: 15px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: var(--radius); background: var(--accent); color: #06130c;
    text-align: center; text-decoration: none; cursor: pointer; margin-top: 8px;
  }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  /* The greyed-out state a submit reaches while its request is in flight —
     see the script at the bottom of this file. `pointer-events: none` rather
     than relying on `disabled` alone: iOS Safari still shows a tap highlight
     on a disabled button otherwise. */
  button[disabled], .btn[disabled] { opacity: .55; cursor: default; pointer-events: none; }
  /* Indeterminate rather than a real percentage: there is no way to know how
     long a request like a Garmin sync will take, and a bar that looks like it
     is measuring something it is not would be worse than none at all. */
  .progress-track {
    height: 4px; border-radius: 999px; background: var(--line);
    overflow: hidden; margin-top: 8px;
  }
  .progress-track .bar {
    height: 100%; width: 40%; border-radius: inherit; background: var(--accent);
    animation: progress-slide 1.1s ease-in-out infinite;
  }
  @keyframes progress-slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  /* A secondary, in-list action — Edit, Mark achieved, Delete — is not the
     one thing this screen is for, and full-width made a two- or three-item
     list look like a wall of buttons. Auto width, hugs its label instead. */
  .btn.small, button.small {
    display: inline-block; width: auto; padding: 8px 14px; font-size: 14px; margin-top: 0;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  /* The home page: a section is a destination to recognise at a glance, not
     a line to read, so a square icon tile rather than the list of buttons
     every other page uses for actions. Fixed two-column grid rather than a
     flex-wrap of fixed-size tiles — a fixed pixel size read as too small on
     phone widths, and this page's max-width (640px) keeps a two-up stretch
     from ever reaching desktop-sized tiles. */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tile {
    min-height: 120px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; padding: 12px;
    text-align: center; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--text); text-decoration: none;
    font-weight: 600; font-size: 13px; line-height: 1.3;
    transition: border-color .15s ease, transform .1s ease;
  }
  .tile:hover { border-color: var(--accent); }
  .tile:active { transform: scale(.97); }
  .tile svg { width: 28px; height: 28px; color: var(--accent); flex-shrink: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip {
    padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 13px; text-decoration: none; color: var(--text);
  }
  .chip.on { background: var(--accent); color: #06130c; border-color: var(--accent); }
  .banner { border-left: 3px solid var(--warn); padding: 10px 12px; background: var(--card);
            border-radius: 0 8px 8px 0; margin-bottom: 14px; font-size: 14px; }
  /* One consistent way back, everywhere but the pages that need none (home,
     login). A pill rather than a full-width button: this is a wayfinding
     link, not an action, and should not compete with the one on the page
     that actually is. */
  .back {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--dim); text-decoration: none; font-size: 14px; font-weight: 600;
    margin-bottom: 16px; padding: 6px 14px 6px 8px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    transition: color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .back:hover { color: var(--accent); border-color: var(--accent); }
  .back:active { transform: scale(.96); }
  .back .arrow {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; background: var(--bg);
    font-size: 13px; line-height: 1; transition: transform .15s ease;
  }
  .back:hover .arrow { transform: translateX(-2px); }
</style>
</head>
<body>
<header>
  <h1><a href="/" style="color:inherit;text-decoration:none">Health</a></h1>
  <span class="sub">{% block subtitle %}{% endblock %}</span>
</header>
{% block back %}{% endblock %}
{% block body %}{% endblock %}
<script>
// Greys out a form's submit button the instant it is pressed, with an
// indeterminate progress bar underneath, so a slow request (a live DeepSeek
// or Garmin call, both measured in seconds rather than milliseconds) reads as
// "working" instead of inviting a second tap. This is a plain page reload,
// not a fetch: the button stays disabled until the browser actually
// navigates to whatever the response redirects to, which is the point.
//
// A form can override the label with `data-loading-label="Syncing…"`;
// without one this falls back to the button's own text with an ellipsis.
document.addEventListener('submit', function (event) {
  // `defaultPrevented` is already true here if a form's own onsubmit (the
  // achievement/goal/condition delete confirmations) returned false — this
  // must not grey out a button whose submission was just cancelled.
  if (event.defaultPrevented) return;

  var form = event.target;
  var button = form.querySelector('button[type="submit"]');
  if (!button || button.disabled) return;

  button.disabled = true;
  button.textContent = form.dataset.loadingLabel || button.textContent + '…';

  var track = document.createElement('div');
  track.className = 'progress-track';
  track.innerHTML = '<div class="bar"></div>';
  button.insertAdjacentElement('afterend', track);
});
</script>
</body>
</html>
