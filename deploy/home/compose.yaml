# Health on the home PC. Installed to /opt/health beside a root-only .env —
# see README.md in this directory.
#
# No Azure: STATE_CONTAINER_URL and KEY_VAULT_URI are unset, so store.py writes
# to LOCAL_STATE_PATH and settings.secret() reads every secret from .env.

services:
  gymlog:
    image: ghcr.io/jay-withers/gym-log/gymlog:${IMAGE_TAG:?set IMAGE_TAG in .env}
    command: ["serve"]
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: home
      LOCAL_STATE_PATH: /data/gymlog.json
    volumes:
      # Must be owned by uid 10001, the image's USER, or every save fails
      # with permission denied.
      - /srv/health/data:/data
    ports:
      # Loopback only. Tailscale serve is the one way in from outside, and it
      # is what supplies the HTTPS the Secure session cookie needs.
      - "127.0.0.1:8000:8000"
